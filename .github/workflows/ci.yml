name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api-node
            context: apps/api-node
          - app: api-python
            context: apps/api-python
          - app: web-php
            context: apps/web-php
          - app: proxy
            context: proxy
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
